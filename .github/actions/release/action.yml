name: 'Release'
description: 'Stages a changesets release (version + stage-publish) and reports what got staged.'

inputs:
  github-token:
    description: 'Token for changesets/action (needs contents:write, pull-requests:write, issues:write).'
    required: true
  commit-message:
    description: 'Commit message for the version-bump commit.'
    required: false
    default: 'ci(changesets): version packages'
  title:
    description: 'PR title for the version-bump PR.'
    required: false
    default: 'ci(changesets): version packages'

outputs:
  staged:
    description: 'true if release.mjs staged at least one package.'
    value: ${{ steps.changesets.outputs.staged }}
  staged_packages:
    description: 'JSON array of {name, version} staged by release.mjs.'
    value: ${{ steps.changesets.outputs.staged_packages }}

runs:
  using: composite
  steps:
    # Both default to true in v2, and must stay off: a staged version isn't
    # public until `promote` confirms npm approval.
    - name: Release
      id: changesets
      uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
      with:
        version-script: pnpm exec changeset version
        publish-script: node ${{ github.action_path }}/release.mjs
        commit-message: ${{ inputs.commit-message }}
        pr-title: ${{ inputs.title }}
        create-github-releases: false
        push-git-tags: false
        github-token: ${{ inputs.github-token }}
      env:
        NPM_CONFIG_PROVENANCE: true
