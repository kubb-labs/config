name: Setup
description: Action that sets up Node, pnpm, and caching with support for Node 22/24

inputs:
  node-version:
    description: 'Node.js version to use (e.g., 22, 24, or 22.x)'
    required: true
    # We leave 'default' empty or omit it so the calling workflow
    # is forced to provide the version it actually needs.
  cache:
    description: 'Cache/build tool to use: "turbo" (default) or "moon"'
    required: false
    default: 'turbo'
  force-install:
    description: 'Re-fetch dependencies with `pnpm install --frozen-lockfile --force` instead of `--prefer-offline`. Defense-in-depth for release jobs so the build does not implicitly trust a pnpm store restored from cache. Lets callers drop a second install step.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Monitors outbound network calls and detects OIDC token exfiltration attempts.
    # Supported on GitHub-hosted Linux runners only.
    - name: Harden runner
      if: runner.os == 'Linux'
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    - name: Setup Node.js environment
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: 'https://registry.npmjs.org'
        cache: 'pnpm'

    # Disabled: safe-chain's proxy sets NODE_EXTRA_CA_CERTS to trust its
    # intercepting cert, which only Node's TLS stack reads. pnpm 12's Rust
    # CLI doesn't read it, so every install fails through the proxy.
    # Re-enable once https://github.com/AikidoSec/safe-chain fixes this
    # (issue filed) or pins a pnpm version that isn't the Rust CLI.
    # - name: Install safe-chain
    #   shell: bash
    #   run: |
    #     curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.18/install-safe-chain.sh -o /tmp/install-safe-chain.sh
    #     echo "bdbc58829853e598c09874fcc193f7cdb2a9a848875be45260a8b59bc4ce5439  /tmp/install-safe-chain.sh" | sha256sum -c -
    #     sh /tmp/install-safe-chain.sh --ci
    #     rm /tmp/install-safe-chain.sh
    #     echo "SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS=48" >> "$GITHUB_ENV"
    #     echo "SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS=kubb,@kubb/*,unplugin-kubb" >> "$GITHUB_ENV"

    - name: Setup Git User
      shell: bash
      run: |
        git config --global user.email "stijn@stijnvanhulle.be"
        git config --global user.name "Stijn Van Hulle"

    - name: Install dependencies
      shell: bash
      # Read from env to keep the input out of the shell command.
      env:
        FORCE_INSTALL: ${{ inputs.force-install }}
      run: |
        if [ "$FORCE_INSTALL" = 'true' ]; then
          pnpm install --frozen-lockfile --force
        else
          pnpm install --frozen-lockfile --prefer-offline
        fi
      
    - name: Setup Turbo cache
      if: ${{ inputs.cache == 'turbo' }}
      uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      continue-on-error: true
      with:
        cache-prefix: kubb_

    - name: Setup moon toolchain
      if: ${{ inputs.cache == 'moon' }}
      uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      with:
        auto-install: true
