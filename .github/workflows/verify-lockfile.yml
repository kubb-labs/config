# Fails when .github/workflows/actions.lock is out of sync with the workflows
# or a locked commit no longer verifies upstream (for example, a re-pointed tag).
name: Verify lockfile

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'

permissions: {}

jobs:
  verify:
    name: Verify lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify
        run: gh actions-lock --verify
