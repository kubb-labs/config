name: Test

on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/setup/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test.yml'

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Setup Tools
        uses: ./.github/setup
        with:
          node-version: '22.23.4'

      - name: Test
        run: pnpm test
